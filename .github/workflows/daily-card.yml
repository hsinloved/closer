# Asks Closer to deal the daily card. Runs hourly; the server only deals once your chosen hour has passed,
# so changing the time in the app's Settings needs no change here.
name: Daily card
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
jobs:
  deal:
    runs-on: ubuntu-latest
    steps:
      - name: Deal today's card
        env:
          CLOSER_URL: ${{ secrets.CLOSER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CLOSER_URL" ] || [ -z "$CRON_SECRET" ]; then echo "CLOSER_URL or CRON_SECRET not set yet; skipping."; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$CLOSER_URL/api/daily"
